<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Arranger — PDF & DOCX</title>
  <meta name="description" content="Minimalist screenshot arranger and instant PDF/DOCX compiler." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- CDN dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #18181b;
      --border: #27272a;
      --border-focus: #52525b;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-subtle: #71717a;
      --accent: #ffffff;
      --accent-text: #09090b;
      --danger: #f43f5e;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Minimal Header */
    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Minimal Drop Zone */
    .dropzone {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 44px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--border-focus);
      background: var(--surface-hover);
    }

    .dropzone-icon {
      color: var(--text-subtle);
      transition: color 0.15s ease;
    }

    .dropzone:hover .dropzone-icon {
      color: var(--text);
    }

    .dropzone-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }

    .dropzone-subtext {
      font-size: 0.8rem;
      color: var(--text-subtle);
    }

    #fileInput {
      display: none;
    }

    /* Queue Section */
    .queue-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .queue-count {
      color: var(--text);
      font-weight: 500;
    }

    .clear-link {
      background: none;
      border: none;
      color: var(--text-subtle);
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s;
    }

    .clear-link:hover {
      color: var(--danger);
    }

    /* Image List */
    .images-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 420px;
      overflow-y: auto;
    }

    .image-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      gap: 12px;
      transition: background 0.15s ease;
    }

    .image-row:hover {
      background: var(--surface-hover);
    }

    .image-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .row-index {
      font-size: 0.8rem;
      color: var(--text-subtle);
      min-width: 18px;
      font-variant-numeric: tabular-nums;
    }

    .row-thumb {
      width: 44px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      background: #000;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .row-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .row-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-details {
      font-size: 0.75rem;
      color: var(--text-subtle);
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .action-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-subtle);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover:not(:disabled) {
      background: var(--border);
      color: var(--text);
    }

    .action-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .action-btn.delete-btn:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.1);
    }

    /* Minimal Options */
    .options-row {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 12px;
      align-items: end;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field-input, .field-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--border-focus);
    }

    .field-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .field-checkbox input {
      accent-color: var(--text);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Actions */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-main {
      flex: 1;
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 11px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s ease;
    }

    .btn-main:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }

    .btn-main:disabled, .btn-outline:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.2s ease;
      pointer-events: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .options-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <h1>Screenshot Arranger</h1>
      <p class="subtitle">Drop screenshots, arrange order, and export directly as PDF or DOCX.</p>
    </header>

    <!-- Drop Zone -->
    <div class="dropzone" id="dropzone">
      <svg class="dropzone-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <div class="dropzone-text">Drop images or click to browse</div>
      <div class="dropzone-subtext">PNG, JPG, WEBP, BMP • Paste anytime with ⌘V</div>
      <input type="file" id="fileInput" multiple accept="image/*" />
    </div>

    <!-- Images Queue & Options -->
    <div class="queue-section" id="queueSection">
      <div class="queue-header">
        <span>Queue (<span class="queue-count" id="itemCount">0</span>)</span>
        <button class="clear-link" id="clearBtn" type="button">Clear all</button>
      </div>

      <!-- Image list items -->
      <div class="images-list" id="imagesList"></div>

      <!-- Options -->
      <div class="options-row">
        <div class="field">
          <label class="field-label" for="docName">Document Name</label>
          <input class="field-input" type="text" id="docName" value="arranged_screenshots" placeholder="File name" />
        </div>
        <div class="field">
          <label class="field-label" for="pageFormat">Page Size</label>
          <select class="field-select" id="pageFormat">
            <option value="letter" selected>Letter</option>
            <option value="a4">A4</option>
          </select>
        </div>
        <label class="field-checkbox">
          <input type="checkbox" id="showCaptions" checked />
          <span>Include captions</span>
        </label>
      </div>

      <!-- Export Buttons -->
      <div class="button-group">
        <button class="btn-main" id="pdfBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span id="pdfLabel">Download PDF</span>
        </button>
        <button class="btn-outline" id="docxBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span id="docxLabel">Download DOCX</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const images = [];

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const queueSection = document.getElementById('queueSection');
    const imagesList = document.getElementById('imagesList');
    const itemCount = document.getElementById('itemCount');
    const clearBtn = document.getElementById('clearBtn');
    const docName = document.getElementById('docName');
    const pageFormat = document.getElementById('pageFormat');
    const showCaptions = document.getElementById('showCaptions');
    const pdfBtn = document.getElementById('pdfBtn');
    const docxBtn = document.getElementById('docxBtn');
    const pdfLabel = document.getElementById('pdfLabel');
    const docxLabel = document.getElementById('docxLabel');
    const toast = document.getElementById('toast');

    // Drag and drop
    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      if (files.length) processFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      if (files.length) processFiles(files);
      fileInput.value = '';
    });

    // Paste handler
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      const files = [];
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          const file = item.getAsFile();
          if (file) files.push(file);
        }
      }
      if (files.length) {
        processFiles(files);
        notify(`Pasted ${files.length} image(s)`);
      }
    });

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function processFiles(files) {
      let count = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          const img = new Image();
          img.onload = () => {
            images.push({
              name: file.name || `screenshot_${images.length + 1}.png`,
              size: file.size,
              type: file.type || 'image/png',
              dataUrl: dataUrl,
              width: img.naturalWidth,
              height: img.naturalHeight
            });
            count++;
            if (count === files.length) {
              render();
              notify(`Added ${files.length} screenshot(s)`);
            }
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    function render() {
      if (images.length === 0) {
        queueSection.style.display = 'none';
        return;
      }

      queueSection.style.display = 'flex';
      itemCount.textContent = images.length;
      imagesList.innerHTML = '';

      images.forEach((img, i) => {
        const row = document.createElement('div');
        row.className = 'image-row';
        row.innerHTML = `
          <div class="image-left">
            <span class="row-index">${i + 1}</span>
            <img class="row-thumb" src="${img.dataUrl}" alt="" />
            <div class="row-meta">
              <span class="row-name" title="${img.name}">${img.name}</span>
              <span class="row-details">${img.width}×${img.height} • ${formatSize(img.size)}</span>
            </div>
          </div>
          <div class="row-actions">
            <button class="action-btn" title="Move Up" ${i === 0 ? 'disabled' : ''} onclick="reorder(${i}, -1)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
            <button class="action-btn" title="Move Down" ${i === images.length - 1 ? 'disabled' : ''} onclick="reorder(${i}, 1)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <button class="action-btn delete-btn" title="Remove" onclick="removeItem(${i})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        `;
        imagesList.appendChild(row);
      });
    }

    window.reorder = (index, delta) => {
      const target = index + delta;
      if (target < 0 || target >= images.length) return;
      const item = images.splice(index, 1)[0];
      images.splice(target, 0, item);
      render();
    };

    window.removeItem = (index) => {
      images.splice(index, 1);
      render();
    };

    clearBtn.addEventListener('click', () => {
      images.length = 0;
      render();
      notify('Cleared all');
    });

    function notify(text) {
      toast.textContent = text;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2400);
    }

    // PDF Export
    pdfBtn.addEventListener('click', async () => {
      if (!images.length) return;
      pdfBtn.disabled = true;
      pdfLabel.textContent = 'Exporting...';

      try {
        const { jsPDF } = window.jspdf;
        const isLetter = pageFormat.value === 'letter';
        const doc = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: isLetter ? 'letter' : 'a4',
          compress: true
        });

        const pageWidth = isLetter ? 215.9 : 210;
        const pageHeight = isLetter ? 279.4 : 297;
        const margin = 12.7; // 0.5 in

        const maxW = pageWidth - (margin * 2);
        const maxH = pageHeight - (margin * 2) - (showCaptions.checked ? 10 : 0);

        for (let i = 0; i < images.length; i++) {
          if (i > 0) doc.addPage();
          const img = images[i];
          let y = margin;

          if (showCaptions.checked) {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.setTextColor(160, 160, 160);
            doc.text(`${i + 1}. ${img.name}`, margin, margin + 4);
            y = margin + 8;
          }

          const aspect = img.width / img.height;
          let targetW = maxW;
          let targetH = targetW / aspect;

          if (targetH > maxH) {
            targetH = maxH;
            targetW = targetH * aspect;
          }

          const x = margin + (maxW - targetW) / 2;
          const format = img.type.includes('png') ? 'PNG' : 'JPEG';
          doc.addImage(img.dataUrl, format, x, y, targetW, targetH, undefined, 'FAST');
        }

        const filename = (docName.value.trim() || 'arranged_screenshots') + '.pdf';
        doc.save(filename);
        notify('PDF exported');
      } catch (err) {
        console.error(err);
        alert('Export error: ' + err.message);
      } finally {
        pdfBtn.disabled = false;
        pdfLabel.textContent = 'Download PDF';
      }
    });

    // DOCX Export
    docxBtn.addEventListener('click', async () => {
      if (!images.length) return;
      docxBtn.disabled = true;
      docxLabel.textContent = 'Exporting...';

      try {
        const { Document, Packer, Paragraph, TextRun, ImageRun } = docx;
        const children = [];

        for (let i = 0; i < images.length; i++) {
          const img = images[i];

          if (showCaptions.checked) {
            children.push(
              new Paragraph({
                children: [
                  new TextRun({
                    text: `${i + 1}. ${img.name}`,
                    bold: true,
                    size: 20,
                    color: "444444"
                  })
                ],
                spacing: { before: 180, after: 80 }
              })
            );
          }

          const byteString = atob(img.dataUrl.split(',')[1]);
          const ab = new ArrayBuffer(byteString.length);
          const ia = new Uint8Array(ab);
          for (let j = 0; j < byteString.length; j++) ia[j] = byteString.charCodeAt(j);

          const aspect = img.width / img.height;
          let targetW = 540;
          let targetH = targetW / aspect;
          if (targetH > 700) {
            targetH = 700;
            targetW = targetH * aspect;
          }

          children.push(
            new Paragraph({
              children: [
                new ImageRun({
                  data: ia,
                  transformation: { width: targetW, height: targetH }
                })
              ],
              spacing: { after: 240 }
            })
          );
        }

        const wordDoc = new Document({
          sections: [{
            properties: {
              page: {
                margin: { top: 720, right: 720, bottom: 720, left: 720 }
              }
            },
            children: children
          }]
        });

        const blob = await Packer.toBlob(wordDoc);
        const filename = (docName.value.trim() || 'arranged_screenshots') + '.docx';
        saveAs(blob, filename);
        notify('DOCX exported');
      } catch (err) {
        console.error(err);
        alert('DOCX export error: ' + err.message);
      } finally {
        docxBtn.disabled = false;
        docxLabel.textContent = 'Download DOCX';
      }
    });
  </script>
</body>
</html>
